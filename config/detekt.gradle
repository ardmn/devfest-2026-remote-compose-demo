// detekt, the same setup for every Kotlin module (android/app, shared, tools); each applies this file after the detekt
// plugin. Groovy, not Kotlin: a Kotlin script plugin does not see the plugin's classes. On top of detekt's default
// config, config/detekt.yml; on the module's src/ (no type resolution). Findings that existed when it was added are in
// the module's detekt-baseline.xml: only new ones fail.
detekt {
    buildUponDefaultConfig = true
    config.setFrom(rootProject.file("../config/detekt.yml"))
    baseline = file("detekt-baseline.xml")
    source.setFrom("src")
}
