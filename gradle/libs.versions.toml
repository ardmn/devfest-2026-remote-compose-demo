[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# Every Remote Compose artifact is the PUBLISHED one from Google Maven, pinned exactly (strictly).
# Latest stable of everything else as of 2026-10-13.
remoteCompose = { strictly = "1.0.0-alpha23" }
okhttp = "5.5.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
composeBom = "2026.09.00"
junit = "4.13.2"
# tools/ runs the @RemoteComposable sections on a plain JVM: Compose for the JVM is JetBrains' build (androidx only
# publishes throwing stubs of compose-ui for the JVM). The same Compose release as the androidx one (1.11).
composeMultiplatform = "1.11.1"
composeMultiplatformIcons = "1.7.3"
coroutines = "1.11.0"
orgJson = "20260814"
# What remote-creation-compose alpha23 declares (its .module): tools/ lists it by hand (it takes the AAR's classes only).
androidxCollection = "1.7.0"

[libraries]
remote-core = { group = "androidx.compose.remote", name = "remote-core", version.ref = "remoteCompose" }
remote-player-core = { group = "androidx.compose.remote", name = "remote-player-core", version.ref = "remoteCompose" }
remote-player-view = { group = "androidx.compose.remote", name = "remote-player-view", version.ref = "remoteCompose" }
remote-player-compose = { group = "androidx.compose.remote", name = "remote-player-compose", version.ref = "remoteCompose" }
remote-creation = { group = "androidx.compose.remote", name = "remote-creation", version.ref = "remoteCompose" }
remote-creation-core = { group = "androidx.compose.remote", name = "remote-creation-core", version.ref = "remoteCompose" }
remote-creation-compose = { group = "androidx.compose.remote", name = "remote-creation-compose", version.ref = "remoteCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Version comes from the Compose BOM.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core", version = "1.7.8" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# tools/ (plain JVM)
jb-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
jb-compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
jb-compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
jb-compose-ui-text = { group = "org.jetbrains.compose.ui", name = "ui-text", version.ref = "composeMultiplatform" }
jb-compose-material-icons = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "composeMultiplatformIcons" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "androidxCollection" }

[plugins]
# AGP 9 has built-in Kotlin: no org.jetbrains.kotlin.android plugin.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# One code style for every Kotlin build: ./gradlew ktfmtFormat (fix) / ktfmtCheck.
ktfmt = { id = "com.ncorti.ktfmt.gradle", version = "0.27.0" }
