# Tests and static analysis: on Linux the Go backend, the Kotlin tools/shared/android code, secrets and SwiftLint;
# on macOS the iOS app build and swift-format. No Android APK is assembled; ci/README.md lists exactly what runs. Every step is judged by its exit code; the analysers fail only on findings that are not in their baselines.
# Within a job each check is its own step with `if: ${{ !cancelled() }}`, so one failing check does not hide the others.
# Versions: actions by commit SHA; gitleaks, OSV-Scanner and SwiftLint here (each once, with the SHA-256 of the
# download); golangci-lint here by version only (the official action installs it, without a checksum); govulncheck in
# backend/go.mod; detekt and ktfmt in gradle/libs.versions.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels its previous run. Pushes to main each get their own group (the commit SHA), so
# every main commit is checked to the end and none is cancelled or left pending behind a newer one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (backend) — golangci-lint, fmt, vet, tests, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain line of go.mod: the one place for the Go release.
          go-version-file: backend/go.mod
          # Module and build cache (govulncheck and its dependencies, the race build).
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
      # The end-to-end test (TestTheRealBackend) runs the real rc tool; BREW_REQUIRE_RC_TOOL=1 makes it fail, not skip,
      # when the tool is missing.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Build the rc tool (for the end-to-end test)
        run: ./gradlew --console=plain installDist
        working-directory: tools
      # Only installs golangci-lint onto the PATH (the action pins the version, not a checksum).
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # The one list of Go checks (cmd/demo lintSteps): fmt --diff, golangci-lint run, go vet, go test -race. Every
      # step runs even if one fails.
      - name: Go checks (go run ./cmd/demo lint -check)
        env:
          BREW_REQUIRE_RC_TOOL: "1"
        run: go run ./cmd/demo lint -check
      # A Go tool of the module: go.mod pins its version, go.sum its bytes.
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go tool govulncheck ./...

  kotlin:
    name: Kotlin (tools, shared, android) — tests, ktfmt, Android Lint, detekt, OSV-Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT-licensed provider on top of actions/cache: free for public and private repositories.
          cache-provider: basic
      # --continue: every task runs even when another one fails, and Gradle reports all failures.
      # The tests render every section and check the committed documents and the iOS catalog are current.
      - name: tools — tests, ktfmt, detekt
        if: ${{ !cancelled() }}
        run: ./gradlew --console=plain --continue test ktfmtCheck detekt
        working-directory: tools
      - name: android, shared — ktfmt, Android Lint, detekt
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew --console=plain --continue
          :app:ktfmtCheck :shared:ktfmtCheck :app:lintDebug :shared:lintDebug :app:detekt :shared:detekt
        working-directory: android
      # OSV-Scanner here, not in the security job: the Gradle daemon is warm and the dependencies are downloaded, so
      # writing the lockfiles costs a configuration, not a second Java + Gradle setup.
      - name: Dependencies (OSV-Scanner)
        if: ${{ !cancelled() }}
        env:
          VERSION: 2.7.1
          SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v$VERSION/osv-scanner_linux_amd64"
          echo "$SHA256  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          PATH="$RUNNER_TEMP/bin:$PATH" python3 ci/check.py --require-tools osv

  security:
    name: Secrets — gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit reachable from the checked-out HEAD (--log-opts=HEAD), not every fetched
          # branch, so a stale branch cannot turn unrelated runs red.
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the history (gitleaks)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts=HEAD .

  swift:
    name: Swift (ios) — SwiftLint
    # Linux: SwiftLint's static build needs no Xcode. It skips the few rules that need SourceKit (they run on macOS).
    # swift-format runs with Xcode's toolchain, locally (ci/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SwiftLint
        env:
          VERSION: 0.65.1
          SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
        working-directory: ios
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$VERSION/swiftlint_linux_amd64.zip"
          echo "$SHA256  $RUNNER_TEMP/swiftlint.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" swiftlint-static -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/swiftlint-static" lint --strict --quiet --baseline swiftlint-baseline.json

  ios:
    name: iOS — xcodebuild (simulator), swift-format
    # A Swift compile error would otherwise pass CI: only SwiftLint runs on Linux. macOS runners are free for public
    # repositories. The newest Xcode 26 on the image is selected (not the image default, which moves with image
    # refreshes); its compiler and swift-format are CI's reference, which can differ from a newer local Xcode.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun swift-format --version
      - name: Build for the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: ios
        run: >-
          xcodebuild build -quiet -project Brew.xcodeproj -scheme Brew
          -destination 'generic/platform=iOS Simulator' -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
      - name: swift-format
        if: ${{ !cancelled() }}
        run: python3 ci/check.py swift-format
