# Build, tests and static analysis. Every step is judged by its exit code; the analysers fail only on findings that
# are not in their baselines (see ci/README.md). Tool versions are pinned in ci/check.py, actions by commit SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (backend) — golangci-lint, vet, govulncheck, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.8"
          # The backend has no dependencies (no go.sum), nothing for setup-go to cache.
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('ci/check.py') }}
      - run: python3 ci/check.py go
      - run: go test -race -count=1 ./...
        working-directory: backend

  kotlin:
    name: Kotlin (tools, shared, android) — tests, ktfmt, Android Lint, detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT-licensed provider on top of actions/cache: free for public and private repositories.
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('ci/check.py') }}
      # Renders every section and checks the committed documents and the iOS catalog are current.
      - run: ./gradlew --console=plain test ktfmtCheck
        working-directory: tools
      - run: ./gradlew --console=plain :app:ktfmtCheck :shared:ktfmtCheck :app:lintDebug :shared:lintDebug
        working-directory: android
      - run: python3 ci/check.py detekt

  security:
    name: Secrets and dependencies — gitleaks, OSV-Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
          persist-credentials: false
      # OSV-Scanner reads Gradle lockfiles, which ci/check.py has Gradle write (and delete) for the scan.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('ci/check.py') }}
      - run: python3 ci/check.py gitleaks osv

  swift:
    name: Swift (ios) — SwiftLint
    # Linux: SwiftLint's static build needs no Xcode. swift-format runs with Xcode's toolchain, locally (ci/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ hashFiles('ci/check.py') }}
      - run: python3 ci/check.py swiftlint
