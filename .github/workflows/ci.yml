# Build, tests and static analysis. Every step is judged by its exit code; the analysers fail only on findings that
# are not in their baselines (see ci/README.md). Tool versions are pinned in ci/check.py, actions by commit SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels its previous run. Pushes to main each get their own group (the commit SHA), so
# every main commit is checked to the end and none is cancelled or left pending behind a newer one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (backend) — golangci-lint, vet, tests, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain line of go.mod (one place for the Go release); check.py pins GOTOOLCHAIN to it as well.
          go-version-file: backend/go.mod
          # No go.sum (no dependencies): go.mod keys the module and build cache (govulncheck, the race build).
          cache-dependency-path: backend/go.mod
      # The end-to-end test (TestTheRealBackend) runs the real rc tool; with CI set it fails instead of skipping.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: ./gradlew --console=plain installDist
        working-directory: tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Per job: each job downloads different tools, and a cache key is saved only by the first job to finish.
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ github.job }}-${{ hashFiles('ci/check.py') }}
      # go run ./cmd/demo lint -check (golangci-lint fmt --diff + run, go vet, go test -race), then govulncheck.
      - run: python3 ci/check.py go

  kotlin:
    name: Kotlin (tools, shared, android) — tests, ktfmt, Android Lint, detekt, OSV-Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT-licensed provider on top of actions/cache: free for public and private repositories.
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ github.job }}-${{ hashFiles('ci/check.py') }}
      # Renders every section and checks the committed documents and the iOS catalog are current.
      - run: ./gradlew --console=plain test ktfmtCheck
        working-directory: tools
      - run: ./gradlew --console=plain :app:ktfmtCheck :shared:ktfmtCheck :app:lintDebug :shared:lintDebug
        working-directory: android
      - run: python3 ci/check.py detekt
      # OSV-Scanner here, not in the security job: the Gradle daemon is warm and the dependencies are downloaded, so
      # writing the lockfiles costs a configuration, not a second Java + Gradle setup. Still a full configuration
      # (the init script changes the build), which no cheaper route avoids while the repo keeps no lockfiles.
      - run: python3 ci/check.py osv

  security:
    name: Secrets — gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ github.job }}-${{ hashFiles('ci/check.py') }}
      - run: python3 ci/check.py gitleaks

  swift:
    name: Swift (ios) — SwiftLint
    # Linux: SwiftLint's static build needs no Xcode. swift-format runs with Xcode's toolchain, locally (ci/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-tools
          key: ci-tools-${{ runner.os }}-${{ github.job }}-${{ hashFiles('ci/check.py') }}
      - run: python3 ci/check.py swiftlint
