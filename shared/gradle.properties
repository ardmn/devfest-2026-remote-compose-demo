# JVM args per developer.android.com/build/optimize-your-build (custom jvmargs must restate MaxMetaspaceSize + HeapDump).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
kotlin.code.style=official
# AGP 9 defaults, so not set here: android.useAndroidX=true, android.nonTransitiveRClass=true,
# android.builtInKotlin=true, android.newDsl=true.
