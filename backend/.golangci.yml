# golangci-lint v2 — https://golangci-lint.run. Run: go run ./cmd/demo lint (or golangci-lint fmt && golangci-lint run).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - dupword
    - errname
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocognit
    - gocritic
    - godot
    - gosec
    - intrange
    - mirror
    - misspell
    - modernize
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over a few bytes of padding
    gocritic:
      enabled-tags: [diagnostic, style, performance]
    gocognit:
      min-complexity: 20
    godot:
      scope: declarations
    revive:
      rules:
        - name: exported
        - name: unused-parameter
        - name: unexported-return
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: context-as-argument
    sloglint:
      kv-only: true
      no-global: all
      static-msg: true
  exclusions:
    rules:
      # A demo server reads files the operator names (stage.json, documents/) and runs the operator's own tool.
      - linters: [gosec]
        text: "G304|G204"
      # 0o644 / 0o755 are the right modes for files the iOS build copies into the app bundle.
      - linters: [gosec]
        text: "G301|G306"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [example.com/brew/backend]
    gofumpt:
      module-path: example.com/brew/backend
      extra:
        group-params: true
        clothe-returns: true
