# SwiftLint 0.65.1 (pinned in .github/workflows/ci.yml). Run: python3 ci/check.py swiftlint (from the repo root).
# swift-format (.swift-format) owns formatting; SwiftLint is for everything else. Findings that existed when this was
# added are in swiftlint-baseline.json: only new ones fail. Regenerate it only on purpose (see ci/README.md).
included:
  - Brew
excluded:
  # Written by tools/ (SwiftCatalog.kt); GeneratedFilesTest keeps it in sync with the Kotlin catalog.
  - Brew/Catalog.generated.swift
disabled_rules:
  # Formatting rules that disagree with swift-format, which adds trailing commas and wraps braces itself.
  - trailing_comma
  - opening_brace
line_length:
  warning: 160
  ignores_comments: false
