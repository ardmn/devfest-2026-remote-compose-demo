# XcodeGen spec. Brew.xcodeproj is generated from it AND committed, so nobody needs XcodeGen to run the app;
# after editing this file run `xcodegen generate` and commit the project too.
name: Brew
options:
  bundleIdPrefix: demo.brew
  deploymentTarget:
    iOS: "17.0"
packages:
  RcComposePlayer:
    # The bare X.Y.Z tag is the one whose Package.swift points at the released XCFramework (see its header).
    url: https://github.com/yschimke/rc-players.git
    exactVersion: 3.5.2
targets:
  Brew:
    type: application
    platform: iOS
    sources:
      - path: Brew
        excludes: ["Resources/sections"]
      - path: Brew/Resources/sections
        type: folder
        buildPhase: resources
    dependencies:
      - package: RcComposePlayer
        product: RcComposePlayerSwiftUI
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # Full data-race checking: shared mutable state must be isolated (an actor) or Sendable; warnings are errors.
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        # rc-players' XCFramework has arm64 slices only (no Intel simulator).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    info:
      path: Brew/Info.plist
      properties:
        # The stage server runs on the Mac: http://127.0.0.1:8080 from the simulator.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        CFBundleDisplayName: Brew
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
